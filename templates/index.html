<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Terminal</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background-color: #0c0c0c; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; padding: 10px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        #terminal { flex: 1; overflow-y: auto; white-space: pre-wrap; font-size: 14px; padding-bottom: 20px; }
        #input-line { display: flex; align-items: center; }
        #prompt { color: #00ff00; margin-right: 5px; }
        #command-input { background: transparent; border: none; color: #00ff00; outline: none; flex: 1; font-family: inherit; font-size: 14px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>
    <div id="terminal">Welcome to Cloud Terminal (Running on Render)\nType 'help' for commands.\n\n</div>
    <div id="input-line">
        <span id="prompt">user@cloud:~#</span>
        <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    </div>

    <script>
        const socket = io();
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('command-input');

        socket.on('output', function(data) {
            if(data.data === "clear") {
                terminal.innerText = "";
            } else {
                terminal.innerText += data.data;
            }
            window.scrollTo(0, document.body.scrollHeight);
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                let cmd = input.value;
                socket.emit('input', { data: cmd });
                terminal.innerText += `user@cloud:~# ${cmd}\n`;
                input.value = '';
            }
        });

        document.body.addEventListener('click', () => input.focus());
    </script>
</body>
</html>
